worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Upstream backend services (Local configuration)
    upstream node_service {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    upstream fastapi_service {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Increased timeouts for transcript retrieval and processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Direct Python FastAPI health/process endpoints
        location /fastapi/ {
            rewrite ^/fastapi/(.*) /$1 break;
            proxy_pass http://fastapi_service;
        }

        # Direct process_video route to FastAPI
        location /process_video {
            proxy_pass http://fastapi_service;
        }

        # Direct ask route to FastAPI
        location /ask {
            proxy_pass http://fastapi_service;
        }

        # Node.js API endpoints (/api/videos, /login, etc.)
        location /api/ {
            proxy_pass http://node_service;
        }

        location /login {
            proxy_pass http://node_service;
        }

        location /vidqa {
            proxy_pass http://node_service;
        }

        # Static CSS and JS caching
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            proxy_pass http://node_service;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # Default route to Node.js application
        location / {
            proxy_pass http://node_service;
        }
    }
}
