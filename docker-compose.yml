version: '3.8'

services:
  # Python FastAPI RAG Processing Service
  processing:
    build:
      context: ./processing
      dockerfile: Dockerfile
    container_name: vidqa-processing
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_PATH=/app/chroma_db
      - PORT=8000
    volumes:
      - ./processing/chroma_db:/app/chroma_db
    networks:
      - vidqa-net

  # Express.js API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidqa-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/vidqa}
      - FASTAPI_URL=http://processing:8000
      - PORT=5000
    depends_on:
      - processing
      - mongo
    networks:
      - vidqa-net

  # MongoDB Container
  mongo:
    image: mongo:7.0
    container_name: vidqa-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - vidqa-mongo-data:/data/db
    networks:
      - vidqa-net

  # Nginx Gateway & Static React Server
  nginx:
    image: nginx:alpine
    container_name: vidqa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - processing
    networks:
      - vidqa-net

networks:
  vidqa-net:
    driver: bridge

volumes:
  vidqa-mongo-data:
